<title>Montage épuré</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Planche d'atelier : la 3D à gauche, la fiche du mouvement à droite ; l'une sous l'autre sur téléphone. */
:root {
  --papier: #f2f3f0; --feuille: #fbfbf9; --encre: #1d2220; --encre-2: #5b625e;
  --trait: #2346a8; --ligne: #d5d8d2; --scene: #e9eae6; --sol: #dcdcd5;
  --f-titre: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --f-texte: "Source Serif 4", Georgia, "Times New Roman", serif;
  --f-tech: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --papier: #151816; --feuille: #1c201e; --encre: #e4e7e2; --encre-2: #a2a9a4;
    --trait: #93acf2; --ligne: #2d332f; --scene: #232825; --sol: #2f3531; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --papier: #151816; --feuille: #1c201e; --encre: #e4e7e2; --encre-2: #a2a9a4;
  --trait: #93acf2; --ligne: #2d332f; --scene: #232825; --sol: #2f3531; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--papier); color: var(--encre); font-family: var(--f-texte); font-size: 1.02rem; line-height: 1.55; padding-inline: 16px; padding-block: 24px 40px; margin: 0; }
.planche { max-width: 1240px; margin-inline: auto; display: grid; gap: 18px; }
.surtitre { font-family: var(--f-tech); font-size: .74rem; letter-spacing: .06em; color: var(--encre-2); text-transform: uppercase; }
header.cartouche { border: 1.5px solid var(--encre); background: var(--feuille); padding: 18px 22px; }
h1 { font-family: var(--f-titre); font-stretch: 125%; font-weight: 800; font-size: clamp(1.8rem, 4.6vw, 2.8rem); line-height: 1; margin: 6px 0 0; }
.cartouche p { margin: 10px 0 0; max-width: 70ch; color: var(--encre-2); }
.regle { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; font-family: var(--f-tech); font-size: .74rem; }
.regle span { border: 1.5px solid var(--encre); padding: 2px 8px; }

.atelier { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); border: 1.5px solid var(--encre); background: var(--feuille); }
.vue { position: relative; border-right: 1.5px solid var(--encre); min-width: 0; display: grid; grid-template-rows: auto 1fr auto auto; }
.barre { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px; border-bottom: 1px solid var(--ligne); }
.barre .sep { flex: 1; }
button { font-family: var(--f-tech); font-size: .76rem; letter-spacing: .03em; padding: 6px 10px; border: 1.5px solid var(--encre); background: var(--feuille); color: var(--encre); cursor: pointer; }
button:hover { background: var(--papier); }
button:disabled { opacity: .4; cursor: default; }
button[aria-pressed="true"] { background: var(--encre); color: var(--feuille); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--trait); outline-offset: 2px; }
.cadre3d { position: relative; min-width: 0; }
#scene { width: 100%; height: 100%; min-height: 460px; aspect-ratio: 4 / 3; max-height: 74vh; display: block; touch-action: none; background: var(--scene); }
.legende { position: absolute; left: 12px; top: 12px; right: 12px; pointer-events: none; display: grid; justify-items: start; gap: 4px; }
.legende .op { font-family: var(--f-tech); font-weight: 600; font-size: .8rem; letter-spacing: .08em; background: var(--trait); color: #fff; padding: 3px 8px; }
.legende .op:empty { display: none; }
.legende .det { font-family: var(--f-tech); font-size: .8rem; background: color-mix(in srgb, var(--feuille) 88%, transparent); color: var(--encre); padding: 3px 8px; border: 1px solid var(--ligne); max-width: 46ch; }
.legende .det:empty { display: none; }
.aide { position: absolute; left: 12px; bottom: 10px; font-family: var(--f-tech); font-size: .68rem; color: var(--encre-2); pointer-events: none; }
.soleils { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 12px 0; align-items: center; font-family: var(--f-tech); font-size: .72rem; color: var(--encre-2); border-top: 1px solid var(--ligne); }
.soleil { display: grid; grid-template-columns: auto 1fr 1fr auto; gap: 8px 12px; align-items: center; padding: 8px 12px 10px; font-family: var(--f-tech); font-size: .74rem; color: var(--encre-2); }
.soleil input[type=range] { width: 100%; accent-color: var(--trait); }

.fiche { padding: 18px 20px; display: grid; gap: 14px; align-content: start; min-width: 0; }
.nav { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.nav .compte { font-family: var(--f-tech); font-size: .8rem; margin-left: auto; color: var(--encre-2); }
ol.etapes { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 5px; }
ol.etapes button { min-width: 2.4em; padding: 5px 7px; display: inline-flex; align-items: center; gap: 4px; }
ol.etapes i, .piece i { width: 10px; height: 10px; display: inline-block; border: 1px solid var(--encre); }
.etape { display: grid; gap: 10px; }
.etape h2 { font-family: var(--f-titre); font-stretch: 112%; font-weight: 700; font-size: 1.45rem; line-height: 1.1; margin: 0; display: flex; gap: 12px; align-items: baseline; text-wrap: balance; }
.etape h2 .n { font-stretch: 62%; font-weight: 800; font-size: 2.4rem; color: var(--trait); line-height: .8; }
.pieces { display: flex; flex-wrap: wrap; gap: 6px; }
.piece { display: inline-flex; align-items: center; gap: 8px; font-family: var(--f-tech); font-size: .76rem; border: 1.5px solid var(--encre); padding: 3px 9px; }
.etape p { margin: 0; }
ol.mvts { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; counter-reset: m; }
ol.mvts li { counter-increment: m; display: grid; grid-template-columns: 1.6em auto 1fr; gap: 8px; align-items: baseline; font-family: var(--f-tech); font-size: .78rem; padding: 5px 8px; border: 1px solid var(--ligne); }
ol.mvts li::before { content: counter(m); color: var(--encre-2); }
ol.mvts li b { font-weight: 600; letter-spacing: .06em; color: var(--trait); }
ol.mvts li[aria-current="true"] { border-color: var(--trait); background: color-mix(in srgb, var(--trait) 10%, transparent); }
.logique { font-family: var(--f-tech); font-size: .8rem; border-left: 3px solid var(--trait); padding: 4px 0 4px 10px; }
.logique b { color: var(--trait); }

section.lecture { border: 1.5px solid var(--encre); background: var(--feuille); padding: 18px 22px; display: grid; gap: 12px; }
section.lecture h2 { font-family: var(--f-titre); font-stretch: 112%; font-size: 1.3rem; margin: 0; }
.args { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; }
.args div { border-top: 1.5px solid var(--encre); padding-top: 8px; min-width: 0; }
.args b { font-family: var(--f-titre); display: block; margin-bottom: 4px; }
.args small { font-family: var(--f-tech); color: var(--encre-2); display: block; margin-bottom: 2px; }
.erreur { padding: 16px; font-family: var(--f-tech); font-size: .8rem; }
footer { font-family: var(--f-tech); font-size: .72rem; color: var(--encre-2); }

@media (max-width: 860px) {
  .atelier { grid-template-columns: 1fr; }
  .vue { border-right: 0; border-bottom: 1.5px solid var(--encre); }
  #scene { min-height: 320px; aspect-ratio: 1 / 1; }
  .soleil { grid-template-columns: auto 1fr; }
}
</style>

<main class="planche">

  <div class="atelier">
    <div class="vue">
      <div class="barre" role="toolbar" aria-label="Vues">
        <button id="v-3d" type="button">Vue 3D</button>
        <button id="v-ouest" type="button">Depuis l'ouest</button>
        <button id="v-dessus" type="button">Plan</button>
        <button id="v-perso" type="button">Vue du personnage</button>
        <span class="sep"></span>
        <button id="promenade" type="button" aria-pressed="false">Promenade</button>
        <button id="couleurs" type="button" aria-pressed="true">Couleurs</button>
      </div>
      <div class="cadre3d">
        <canvas id="scene" aria-label="Maquette 3D animée"></canvas>
        <div class="legende" aria-live="polite"><span class="op" id="op"></span><span class="det" id="det"></span></div>
      </div>
      <div class="soleils" role="group" aria-label="Soleil à Tunis">
        <span>Soleil à Tunis :</span>
        <button type="button" data-soleil="180,77">Midi été</button>
        <button type="button" data-soleil="180,30">Midi hiver</button>
        <button type="button" data-soleil="302,5">Couchant été</button>
        <button type="button" data-soleil="238,5">Couchant hiver</button>
      </div>
      <div class="soleil">
        <span>Soleil</span>
        <input id="azimut" type="range" min="0" max="360" value="25" aria-label="Direction du soleil">
        <input id="hauteur" type="range" min="5" max="88" value="38" aria-label="Hauteur du soleil">
        <button id="tourner" type="button" aria-pressed="false">Faire tourner</button>
      </div>
    </div>

    <div class="fiche">
      <div class="nav">
        <button id="prec" type="button">← Précédent</button>
        <button id="suiv" type="button">Suivant →</button>
        <button id="rejouer" type="button">Rejouer</button>
        <button id="tout" type="button">▶ Tout le montage</button>
        <span class="compte" id="compte"></span>
      </div>
      <ol class="etapes" id="liste"></ol>
      <div class="etape" id="etape"></div>
    </div>
  </div>
</main>

<script>

  fleche.rotation.x = -Math.PI / 2; nord.add(fleche);
  const cv = document.createElement("canvas"); cv.width = cv.height = 64;
  const cx = cv.getContext("2d"); cx.fillStyle = "#2346a8"; cx.font = "bold 48px sans-serif"; cx.textAlign = "center"; cx.textBaseline = "middle"; cx.fillText("N", 32, 34);
  const lettre = new THREE.Mesh(new THREE.PlaneGeometry(0.4, 0.4), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(cv), transparent: true }));
  lettre.rotation.x = -Math.PI / 2; lettre.position.z = -0.85; nord.add(lettre);
  nord.position.copy(T([-4.6, 3.2, 0.004])); scene.add(nord);

  // ---- mouvements : matrice (repère maths) d'un mouvement arrivé à la fraction t ----
  function matrice(op, t) {
    if (op.type === "T") return new THREE.Matrix4().makeTranslation(op.v[0] * t, op.v[1] * t, op.v[2] * t);
    const a = THREE.MathUtils.degToRad(op.angle * t), c = V(op.c);
    const m = new THREE.Matrix4().makeTranslation(c.x, c.y, c.z)
      .multiply(new THREE.Matrix4().makeRotationAxis(V(op.axe).normalize(), a))
      .multiply(new THREE.Matrix4().makeTranslation(-c.x, -c.y, -c.z));
    const s = Math.abs(Math.sin(a));
    return new THREE.Matrix4().makeTranslation(op.leve[0] * s + op.glisse[0] * t, op.leve[1] * s + op.glisse[1] * t, op.leve[2] * s + op.glisse[2] * t).multiply(m);
  }
  // poses de chaque pièce avant chaque mouvement de la frise
  const AVANT = [Object.fromEntries(NOMS.map(k => [k, new THREE.Matrix4()]))];
  MV.forEach((m, i) => {
    const p = {};
    for (const k of NOMS) p[k] = m.ops[k] ? matrice(m.ops[k], 1).multiply(AVANT[i][k]) : AVANT[i][k].clone();
    AVANT.push(p);
  });

  // ---- pièces : carton en double épaisseur, dessinées à leur place dans le tangram ----
  const CARTON = 0xb8ab97;
  const objets = {};
  for (const k of NOMS) {
    const pts = DEPART[k];
    const forme = new THREE.Shape(pts.map(p => new THREE.Vector2(p[0], p[1])));
    const geo = new THREE.ExtrudeGeometry(forme, { depth: EP, bevelEnabled: false });
    // grands triangles : face de référence dessus ; triangle moyen : posé dessus ; les autres : carton centré
    if (!["G1", "G2", "M"].includes(k)) geo.translate(0, 0, -EP / 2);
    const mat = new THREE.MeshStandardMaterial({ color: CARTON, roughness: 0.9, metalness: 0, side: THREE.DoubleSide, transparent: k === "G1" || k === "G2", opacity: 1 });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.castShadow = true; mesh.receiveShadow = true;
    mesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo, 20), new THREE.LineBasicMaterial({ color: 0x2a2620, transparent: true, opacity: 0.6 })));
    mesh.matrixAutoUpdate = false;
    const c = pts.reduce((a, p) => a.add(V(p)), new THREE.Vector3()).multiplyScalar(1 / pts.length);
    objets[k] = { mesh, mat, centre: c, couleur: new THREE.Color(PIECES[k].couleur) };
    scene.add(mesh);
  }

  // ---- aides : la flèche d'une translation, l'axe d'une rotation ou d'un pliage ----
  const BLEU = 0x2346a8;
  const aides = new THREE.Group(); scene.add(aides);
  const matAxe = new THREE.MeshBasicMaterial({ color: BLEU, depthTest: false, transparent: true, opacity: 0.9 });
  function tube(A, B, r) {
    const d = B.clone().sub(A), L = d.length();
    const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, L, 10), matAxe);
    m.position.copy(A).add(B).multiplyScalar(0.5);
    m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize());
    m.renderOrder = 10; m.userData.jetable = true; return m;
  }
  let aideDe = -1;
  function viderAides() {
    // les flèches partagent leur géométrie : on ne jette que leurs matériaux, et nos tubes
    aides.traverse(o => { if (o.userData.jetable) o.geometry.dispose(); if (o.material && o.material !== matAxe) o.material.dispose(); });
    aides.clear(); aideDe = -1;
  }
  function majAides(i, t) {
    if (i === aideDe && !(MV[i] && MV[i].ops.G1)) return;
    viderAides(); aideDe = i;
    const m = MV[i]; if (!m) return;
    for (const k in m.ops) {
      const op = m.ops[k];
      const c0 = objets[k].centre.clone().applyMatrix4(AVANT[i][k]);
      if (op.type === "T") {
        const a = c0.clone(); if (a.z < 0.2) a.z = 0.12;
        const b = a.clone().add(V(op.v));
        const d = b.clone().sub(a);
        const fl = new THREE.ArrowHelper(T([d.x, d.y, d.z]).sub(T([0, 0, 0])).normalize(), T([a.x, a.y, a.z]), d.length(), BLEU, Math.min(0.35, d.length() * 0.4), 0.2);
        fl.line.material.depthTest = false; fl.cone.material.depthTest = false; fl.renderOrder = 10;
        aides.add(fl);
      } else {
        const s = Math.abs(Math.sin(THREE.MathUtils.degToRad(op.angle * t)));
        const c = V(op.c).add(V(op.leve).multiplyScalar(s)).add(V(op.glisse).multiplyScalar(t));
        const u = V(op.axe).normalize();
        if (Math.abs(u.z) > 0.9) {                     // rotation à plat : un pivot vertical
          aides.add(tube(T([c.x, c.y, 0]), T([c.x, c.y, 1.1]), 0.035));
        } else {                                        // pliage : la charnière
          const p = c.clone().add(u.clone().multiplyScalar(c0.clone().sub(c).dot(u)));
          const L = k === "G1" || k === "G2" ? 1.9 : 1.0;
          const A = p.clone().addScaledVector(u, -L), B = p.clone().addScaledVector(u, L);
          aides.add(tube(T([A.x, A.y, A.z]), T([B.x, B.y, B.z]), 0.035));
        }
      }
    }
  }

  // ---- personnage de 3 cm ----
  const perso = new THREE.Group();
  const matP = new THREE.MeshStandardMaterial({ color: 0x2b2f3a, roughness: 0.7 });
  const corps = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.1, 0.56, 16), matP); corps.position.y = 0.28;
  const tete = new THREE.Mesh(new THREE.SphereGeometry(0.1, 16, 12), matP); tete.position.y = 0.68;
  for (const m of [corps, tete]) { m.castShadow = true; perso.add(m); }
  scene.add(perso);
  const CH = DATA.chemin, seg = [];
  let LT = 0;
  for (let i = 0; i < CH.length - 1; i++) { const L = Math.hypot(CH[i + 1][0] - CH[i][0], CH[i + 1][1] - CH[i][1]); seg.push(L); LT += L; }
  let sP = 0, sens = 1;
  function placerPerso() {
    let s = sP, i = 0;
    while (i < seg.length - 1 && s > seg[i]) { s -= seg[i]; i++; }
    const a = CH[i], b = CH[i + 1], t = Math.min(1, s / seg[i]);
    perso.position.copy(T([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, 0]));
    perso.rotation.y = Math.atan2((b[0] - a[0]) * sens, (b[1] - a[1]) * sens);
  }
  placerPerso();
  const btnProm = document.getElementById("promenade");
  btnProm.addEventListener("click", () => { marche = !marche; btnProm.setAttribute("aria-pressed", marche); if (marche && etape !== FIN) window.allerEtape(FIN); });

  // ---- caméra ----
  const CADRES = {
    chantier: { c: [0.1, -0.4, 0.3], d: [2.8, -9.2, 7.9] },
    fini:     { c: [1.7, 0, 0.5],    d: [-6.6, -8.4, 6.2] },
  };
  const ABSOLUES = {
    "v-ouest":  () => ({ p: T([-7.2, 0, 2.0]), c: T([2, 0, 0.8]) }),
    "v-dessus": () => ({ p: T([0.6, -0.41, 13]), c: T([0.6, -0.4, 0]) }),
    "v-perso":  () => ({ p: T([5.0, 0.6, 0.62]), c: T([0, 0.6, 0.6]) }),
  };
  let anim = null, vue = "v-3d", cadreCourant = null;
  const cadre = () => etape === FIN ? CADRES.fini : CADRES.chantier;
  function cible() {
    if (vue !== "v-3d") return ABSOLUES[vue]();
    const C = cadre();
    const k = Math.pow(Math.max(1, 1.25 / camera.aspect), 0.9);
    return { p: T([C.c[0] + C.d[0] * k, C.c[1] + C.d[1] * k, C.c[2] + C.d[2] * k]), c: T(C.c) };
  }
  function allerVers(instant) {
    // vue du personnage : un champ large, comme l'objectif d'un téléphone posé à 3 cm du sol
    const fov = vue === "v-perso" ? 62 : 32;
    if (camera.fov !== fov) { camera.fov = fov; camera.updateProjectionMatrix(); }
    const W = cible();
    if (instant) { camera.position.copy(W.p); controls.target.copy(W.c); anim = null; return; }
    anim = { p0: camera.position.clone(), c0: controls.target.clone(), p1: W.p, c1: W.c, t: 0 };
  }
  const BOUTONS = ["v-3d", "v-ouest", "v-dessus", "v-perso"];
  const marquer = () => BOUTONS.forEach(id => document.getElementById(id).setAttribute("aria-pressed", id === vue));
  for (const id of BOUTONS) document.getElementById(id).addEventListener("click", () => {
    vue = id; marquer();
    if (id !== "v-3d" && etape !== FIN) window.allerEtape(FIN);
    allerVers();
  });
  controls.addEventListener("start", () => { if (vue !== "v-3d") { vue = null; marquer(); if (camera.fov !== 32) { camera.fov = 32; camera.updateProjectionMatrix(); } } });
  marquer();

  // ---- soleil ----
  const az = document.getElementById("azimut"), ht = document.getElementById("hauteur");
  const btnTourner = document.getElementById("tourner");
  function placerSoleil() {
    const a = THREE.MathUtils.degToRad(+az.value), h = THREE.MathUtils.degToRad(+ht.value);
    const dir = new THREE.Vector3(Math.cos(h) * Math.sin(a), Math.sin(h), Math.cos(h) * Math.cos(a));
    soleil.position.copy(dir.clone().multiplyScalar(22));
    soleil.target.position.set(0, 0, 0);
    disque.position.copy(dir.multiplyScalar(13));
  }
  az.addEventListener("input", placerSoleil); ht.addEventListener("input", placerSoleil);
  // azimut compté depuis le nord, dans le sens des aiguilles d'une montre
  document.querySelectorAll("[data-soleil]").forEach(b => b.addEventListener("click", () => {
    const [A, h] = b.dataset.soleil.split(",").map(Number);
    az.value = (540 - A) % 360; ht.value = h; tourne = false; btnTourner.setAttribute("aria-pressed", false); placerSoleil();
  }));
  placerSoleil();
  btnTourner.addEventListener("click", () => { tourne = !tourne; btnTourner.setAttribute("aria-pressed", tourne); });

  // ---- couleurs ----
  const btnCoul = document.getElementById("couleurs");
  btnCoul.addEventListener("click", () => { enCouleurs = !enCouleurs; btnCoul.setAttribute("aria-pressed", enCouleurs); majCouleurs(); });
  function majCouleurs() {
    const cur = ETAPES[etape].pieces;
    for (const k of NOMS) {
      const o = objets[k];
      o.mat.color.copy(enCouleurs || cur.includes(k) ? o.couleur : new THREE.Color(CARTON));
      o.mat.emissive.setHex(cur.includes(k) ? 0x202020 : 0x000000);
    }
  }

  // ---- étapes ----
  window.allerEtape = function (n, instant) {
    etape = Math.max(0, Math.min(FIN, n));
    toutJouer = false;
    const avant = gCible;
    gCible = BOUT[etape];
    if (instant) g = gCible;
    perso.visible = etape === FIN;
    if (!perso.visible && marche) { marche = false; btnProm.setAttribute("aria-pressed", false); }
    majCouleurs(); afficherFiche();
    if (vue !== "v-3d" && etape !== FIN) { vue = "v-3d"; marquer(); cadreCourant = null; }
    if (vue === "v-3d" && (cadre() !== cadreCourant || instant)) { cadreCourant = cadre(); allerVers(instant); }
  };
  window.rejouer = function () { if (etape > 0 && etape < FIN) { g = DEBUT[etape]; gCible = BOUT[etape]; } };
  window.toutLeMontage = function () {
    window.allerEtape(0, true); toutJouer = true; gCible = MV.length; g = 0;
  };

  // ---- boucle ----
  const reduit = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  const horloge = new THREE.Clock();
  function taille() {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    if (canvas.width !== Math.floor(w * renderer.getPixelRatio()) || canvas.height !== Math.floor(h * renderer.getPixelRatio())) {
      renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
    }
  }
  const lisse = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  const legOp = document.getElementById("op"), legDet = document.getElementById("det");
  let legende = "", dejaActif = -2, dejaEtape = -1;
  function poser() {
    const i = Math.min(Math.floor(g), MV.length - 1), t = g >= MV.length ? 1 : lisse(g - Math.floor(g));
    const m = MV[i];
    for (const k of NOMS) {
      const P = m && m.ops[k] && g < MV.length ? matrice(m.ops[k], t).multiply(AVANT[i][k]) : AVANT[Math.min(Math.ceil(g - 1e-9), MV.length)][k];
      objets[k].mesh.matrix.multiplyMatrices(K, P);
    }
    const bouge = Math.abs(g - gCible) > 1e-6;
    // pentes transparentes quand une pièce passe dessous
    const voir = bouge && m && m.voir && g < MV.length;
    for (const k of ["G1", "G2"]) { const o = objets[k].mat; o.opacity += ((voir ? 0.35 : 1) - o.opacity) * 0.2; o.depthWrite = o.opacity > 0.95; }
    if (bouge && m) majAides(i, t); else if (aideDe !== -1) viderAides();
    const L = bouge && m ? m.type + "|" + m.texte : (etape === 0 ? "|Le tangram posé en losange, sa diagonale dans l'axe est–ouest" : etape === FIN ? "|L'abri est monté" : "|" + ETAPES[etape].titre + " : en place");
    if (L !== legende) { legende = L; const [a, b] = L.split("|"); legOp.textContent = a; legDet.textContent = b; }
    // la fiche suit la frise pendant « Tout le montage »
    if (toutJouer && m && m.etape !== etape && bouge) { etape = m.etape; majCouleurs(); afficherFiche(); }
    if (toutJouer && !bouge) { toutJouer = false; window.allerEtape(FIN); }
    const actif = bouge && m && m.etape === etape ? i - DEBUT[etape] : -1;
    if (actif !== dejaActif || etape !== dejaEtape) {
      dejaActif = actif; dejaEtape = etape;
      document.querySelectorAll("#mvts li").forEach((li, j) => li.setAttribute("aria-current", j === actif));
    }
  }
  function boucle() {
    const dt = Math.min(horloge.getDelta(), 0.05);
    taille();
    if (g !== gCible && !window.FIGER) {   // FIGER : arrêt sur image (captures de contrôle)
      const ecart = gCible - g;
      const v = reduit ? 1e9 : Math.max(ecart > 0 ? 1 / 1.5 : 1 / 0.6, Math.abs(ecart) / (toutJouer ? 1e9 : 3));
      g = Math.abs(ecart) <= v * dt ? gCible : g + Math.sign(ecart) * v * dt;
    }
    poser();
    if (marche && !reduit) {
      sP += sens * dt * 0.55;
      if (sP > LT) { sP = LT; sens = -1; }
      if (sP < 0) { sP = 0; sens = 1; }
      placerPerso();
      perso.position.y += Math.abs(Math.sin(performance.now() / 140)) * 0.03;
    }
    perso.visible = etape === FIN && vue !== "v-perso";
    if (tourne && !reduit) { az.value = (+az.value + dt * 30) % 360; placerSoleil(); }
    if (anim) {
      anim.t = Math.min(1, anim.t + (reduit ? 1 : dt / 0.9));
      const e = lisse(anim.t);
      camera.position.lerpVectors(anim.p0, anim.p1, e);
      controls.target.lerpVectors(anim.c0, anim.c1, e);
      if (anim.t >= 1) anim = null;
    }
    controls.update();
    renderer.render(scene, camera);
    requestAnimationFrame(boucle);
  }
  taille();
  window.allerEtape(0, true);
  boucle();
}

// ---- fiche (lisible même sans 3D) ----
function afficherFiche() {
  const E = ETAPES[etape];
  document.getElementById("etape").innerHTML =
    `<h2><span class="n">${etape}</span>${E.titre}</h2>` +
    (E.pieces.length ? `<div class="pieces">${E.pieces.map(k => `<span class="piece"><i style="background:${PIECES[k].couleur}"></i>${PIECES[k].nom}</span>`).join("")}</div>` : "") +
    `<p>${E.texte}</p>` +
    (E.mouvements.length ? `<ol class="mvts" id="mvts">${E.mouvements.map(m => `<li><b>${m.type}</b><span>${m.texte}</span></li>`).join("")}</ol>` : "") +
    (E.logique ? `<div class="logique"><b>Logique :</b> ${E.logique}</div>` : "");
  document.getElementById("compte").textContent = `Étape ${etape} / ${FIN}`;
  document.querySelectorAll("#liste button").forEach((b, i) => b.setAttribute("aria-pressed", i === etape));
  document.getElementById("prec").disabled = etape === 0;
  document.getElementById("suiv").disabled = etape === FIN;
  document.getElementById("rejouer").disabled = etape === 0 || etape === FIN;
}
const liste = document.getElementById("liste");
ETAPES.forEach((E, i) => {
  const li = document.createElement("li"), b = document.createElement("button");
  b.type = "button"; b.id = "etape-" + i;
  b.innerHTML = E.pieces.map(k => `<i style="background:${PIECES[k].couleur}"></i>`).join("") + i;
  b.title = E.titre;
  b.addEventListener("click", () => window.allerEtape(i));
  li.append(b); liste.append(li);
});
window.allerEtape = n => { etape = Math.max(0, Math.min(FIN, n)); afficherFiche(); };
document.getElementById("prec").addEventListener("click", () => window.allerEtape(etape - 1));
document.getElementById("suiv").addEventListener("click", () => window.allerEtape(etape + 1));
document.getElementById("rejouer").addEventListener("click", () => window.rejouer && window.rejouer());
document.getElementById("tout").addEventListener("click", () => window.toutLeMontage && window.toutLeMontage());
document.addEventListener("keydown", e => {
  if (e.target.closest && e.target.closest("input")) return;
  if (e.key === "ArrowRight") window.allerEtape(etape + 1);
  if (e.key === "ArrowLeft") window.allerEtape(etape - 1);
});
afficherFiche();
try { demarrer(); }
catch (e) {
  document.getElementById("scene").replaceWith(Object.assign(document.createElement("div"), { className: "erreur", textContent: "La vue 3D n'a pas pu démarrer (" + e.message + "). Les étapes du montage restent lisibles à droite." }));
}
</script>
